version: 2
updates:
  # The actions CI runs, pinned to commits in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  # The package itself is stdlib-only, so there is nothing for the "pip"
  # updater to do. It is deliberately not pointed at requirements-ci.txt: that
  # file pins a different pytest for each Python, and the updater raised the
  # one for Python 3.9 to a release that needs 3.10. Regenerate the file with
  # the command in its header instead.
