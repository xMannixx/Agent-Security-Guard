version: 2
updates:
  # The actions CI runs, pinned to commits in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  # The package itself is stdlib-only. This is what CI installs to run the
  # tests (requirements-ci.txt, pinned with hashes).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
