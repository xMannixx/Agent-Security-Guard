name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token a job gets can read the repository and nothing else. Without this
# block it has whatever the repository's default grants, which may be write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      # Actions are pinned to a commit. A tag such as v7 can be moved to other
      # code by whoever controls the action's repository; a commit cannot.
      # Dependabot keeps the hash and the version comment in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run tests
        working-directory: security/agent-security-guard
        run: python -m pytest tests -v
