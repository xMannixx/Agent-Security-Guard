name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token a job gets can read the repository and nothing else. Without this
# block it has whatever the repository's default grants, which may be write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # SKILL.md claims linux, macos and windows. Only ubuntu was ever run,
        # so the other two were a claim and not a result. Full version sweep on
        # ubuntu; one version each on macos and windows, enough to catch what
        # differs between platforms rather than between interpreters.
        os: [ubuntu-latest]
        python-version: ["3.8", "3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      # Actions are pinned to a commit. A tag such as v7 can be moved to other
      # code by whoever controls the action's repository; a commit cannot.
      # Dependabot keeps the hash and the version comment in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run tests
        working-directory: security/agent-security-guard
        run: python -m pytest tests -v
