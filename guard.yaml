# agent-security-guard policy
#
# Every setting here is actually read by the policy engine. (Before 0.3.0
# `mode` and `tiers` were decorative, so an over-blocking guard could not be
# loosened without uninstalling it.)
#
# The plugin loads the first of these that exists:
#   /etc/agent-security-guard/guard.yaml
#   ~/.hermes/guard.yaml
#   the copy shipped next to the plugin (this file)
# It does NOT load a guard.yaml from the working directory. That is the agent's
# workspace, and a policy file placed there could switch the guard off.

# monitor         -> never blocks. Logs what it WOULD have blocked
#                    (decision=allow_with_warning, advisory_decision=...).
#                    Use this first in a live host, and as the panic switch.
# autonomous-safe -> DEFAULT. Blocks only the narrow, unambiguous danger set:
#                    untrusted -> shell/install, secret exfiltration,
#                    unauthorized self-modification, privileged memory
#                    injection. Unrecognized tool kinds are allowed + audited.
# strict          -> also stops and asks on unrecognized tool kinds.
#
# The env var AGENT_SECURITY_GUARD_MODE overrides this without editing files,
# e.g. AGENT_SECURITY_GUARD_MODE=monitor to stop all blocking. It is read once,
# when the guard starts: set it and restart the host. Changing it inside a
# running process has no effect.
mode: autonomous-safe

# What to do when the guard itself cannot evaluate a call (broken install, a
# bug in the engine).
#   degrade  -> DEFAULT. Reads and unrecognized host tools keep working,
#               flagged as degraded. State-changing kinds (external write,
#               memory write, config change, ...) and kinds dangerous by name
#               are blocked until the guard works again.
#   deny_all -> Block everything. Safest, but a broken install takes the
#               host down completely. The natural partner of `mode: strict`.
# A guard.yaml that cannot be parsed is a different case: the engine keeps
# evaluating on the built-in defaults and its decisions carry `config_error`.
on_error: degrade

# Infer "no-write scope" / "ambiguous confirmation" from raw user wording.
# Off by default: an everyday "ok" or "nur lesen" otherwise denied every
# state-changing action in that turn. Prefer passing the flags explicitly.
scope_from_text: false

# Domains the agent may write to without a per-call confirmation.
domain_allowlist: []

# Per-tier decisions. These tune the operator-facing paths. The
# untrusted-origin denials (untrusted -> shell/install/config, secret exfil,
# privileged memory) are deliberately NOT tunable here: softening them would
# remove the guarantee the guard exists for.
tiers:
  read_only: allow
  local_read: allow
  external_write: require_confirmation
  shell_from_user: require_confirmation
  install_from_user: require_confirmation
  config_change: require_confirmation
  download_inspect: allow
  # An unrecognized tool kind is not evidence of danger. Blocking it is what
  # took hosts down in 0.2.x. Raise to require_confirmation only if your host
  # can actually surface a prompt for every unknown tool.
  unknown_action: allow_with_warning
  # ...unless the host itself says untrusted content proposed the action. That
  # is evidence, so the default is deny. If it catches a harmless tool, declare
  # that tool in `tool_tiers` below rather than loosening this.
  unknown_action_from_untrusted: deny
  # A file write by a host file tool (write_file, patch, edit, ...) on a
  # trusted origin.
  local_write: allow_with_warning
  # A host tool the guard recognized by its name (terminal, bash,
  # execute_code, send_email, ...) on a trusted origin with nothing pointing at
  # danger. The host never opted into a confirmation flow for it, so asking
  # would block the host's own tool. Set to require_confirmation only if your
  # host can surface a prompt. Kinds the host names explicitly (shell,
  # http_post, ...) and tools declared in `tool_tiers` use the settings above.
  recognized_host_tool: allow_with_warning
  # Non-tunable, listed for transparency:
  shell_from_untrusted: deny
  install_from_untrusted: deny
  local_write_from_untrusted: deny
  memory_external_to_evidence: allow_with_warning
  memory_external_to_identity: require_confirmation
  memory_external_to_authorization: deny
  memory_external_to_procedural: deny
  download_then_execute_untrusted: deny
  download_then_execute_user: require_confirmation

# Tiers for your host's own tools: `tool name: tier`. The guard knows the common
# names (terminal, bash, execute_code, write_file, patch, skill_manage, ...);
# declare what it does not know or reads wrongly. A declaration wins over the
# built-in tables and gives the tool the full rules of its tier.
# Tiers: read_only, local_read, local_write, external_write, execution,
#        download, install, config_change, memory_write, self_modification,
#        secret_handling, unknown.
# Example:
#   tool_tiers:
#     codebase_search: read_only
#     cronjob_manage: config_change
#     my_deploy_tool: execution
tool_tiers: {}

# Writing one of these with a file tool changes the agent's own future
# behavior, so it is held to the self-modification bar (explicit user order,
# never a direct allow) instead of being treated as a plain file write. Same
# pattern syntax as sensitive_paths; matched case-insensitively.
self_modification_paths:
  - "SKILL.md"
  - "guard.yaml"

# Real secret material only. Anything listed here raises DataSensitivity, and a
# sensitive read then gates later external writes via the exfiltration chain.
# Do NOT add broad developer-file globs (*.db, *.log, settings.json, config.py):
# in 0.2.x they marked ordinary project files as sensitive, which denied every
# subsequent external write for the rest of the session.
sensitive_paths:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*.pfx"
  - "*.kdbx"
  - "id_rsa"
  - "id_rsa.*"
  - ".ssh/"
  - ".aws/"
  - ".gcp/"
  - ".azure/"
  - ".kube/"
  - ".npmrc"
  - ".pypirc"
  - ".netrc"
  - ".git-credentials"
  - "secrets.*"
  - "credentials.*"

# Patterns that mark content as secret-bearing. These match credential
# *values*, not the mere mention of a credential word: a bare `(?i)api[_-]?key`
# classified any document discussing API keys as SECRET.
secret_patterns:
  - "(?i)api[_-]?key\\s*[:=]\\s*[\"']?[A-Za-z0-9._\\-]{16,}"
  - "(?i)secret[_-]?key\\s*[:=]\\s*[\"']?[A-Za-z0-9._\\-]{16,}"
  - "(?i)access[_-]?token\\s*[:=]\\s*[\"']?[A-Za-z0-9._\\-]{16,}"
  - "(?i)password\\s*[:=]\\s*[\"']?[^\\s\"']{8,}"
  - "(?i)bearer\\s+[A-Za-z0-9._-]{20,}"
  - "AKIA[0-9A-Z]{16}"
  - "gh[pousr]_[A-Za-z0-9]{30,}"
  - "sk-[A-Za-z0-9]{20,}"
  - "xox[baprs]-[A-Za-z0-9-]{10,}"
  - "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"

audit:
  backend: sqlite
  path: "guard-audit.db"
  jsonl_path: "guard-audit.jsonl"

limits:
  max_content_chars: 20000
  max_history_events: 50
  # How many recent actions count as "the current chain" when the host passes
  # no chain_id. Without this window the whole session was one chain, so a
  # single sensitive read denied every later external write indefinitely.
  chain_window: 12
